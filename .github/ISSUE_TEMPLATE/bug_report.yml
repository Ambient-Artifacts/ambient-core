name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems go to [SECURITY.md](https://github.com/Ambient-Artifacts/ambient-core/security/policy), not here.** Remove secrets, tokens and note text from anything you paste.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Self-hosted (Docker Compose)
        - Self-hosted (other)
        - Ambient Cloud
        - Development (running the code or tests)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The steps, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you run (`git rev-parse --short HEAD`), or the date you last updated.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For self-hosted servers, `docker compose ps` and `docker compose logs <service>` around the time it happened.
      render: shell
