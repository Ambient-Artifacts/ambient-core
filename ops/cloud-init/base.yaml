#cloud-config
# Base image for every Brain VM (core and team servers): Node 24, git, Caddy,
# automatic security updates, a locked-down firewall and an unprivileged
# `brain` user. Role-specific config comes from ops/deploy.sh.
package_update: true
package_upgrade: true
packages:
  - git
  - curl
  - ca-certificates
  - gnupg
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - unattended-upgrades
  - ufw
  - rsync
  # Fallback for native npm modules (better-sqlite3) when no prebuilt binary fits (e.g. Arm).
  - build-essential
  - python3
users:
  - default
  - name: brain
    system: true
    shell: /usr/sbin/nologin
    homedir: /srv/brain
    no_create_home: true
write_files:
  - path: /etc/apt/apt.conf.d/52brain-unattended
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      // Node (NodeSource) and Caddy (Cloudsmith) face the internet too: their updates as well.
      Unattended-Upgrade::Origins-Pattern {
        "site=deb.nodesource.com";
        "site=dl.cloudsmith.io";
      };
runcmd:
  # NodeSource's signed apt repository (as for Caddy below), not its setup script piped into bash.
  - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
  - echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
  - apt-get update && apt-get install -y nodejs
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update && apt-get install -y caddy
  - mkdir -p /opt/brain /etc/brain /srv/brain
  - chown -R brain:brain /srv/brain && chmod 750 /srv/brain
  - chmod 750 /etc/brain && chown root:brain /etc/brain
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now unattended-upgrades
